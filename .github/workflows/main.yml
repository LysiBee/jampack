name: Fast Datapack Push

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: SFTP Delta Sync
    runs-on: ubuntu-latest

    steps:
      # 1. Faster code download (fetch-depth: 0 is required for delta sync to see changes)
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Native, parallel, delta-only file transfer
      - name: Sync Changed Files Only
        uses: milanmk/ftp-sftp-file-deployer@v1.18
        with:
          remote-protocol: sftp
          remote-host: ${{ secrets.SFTP_HOST }}
          remote-port: ${{ secrets.SFTP_PORT }}
          remote-user: ${{ secrets.SFTP_USERNAME }}
          remote-password: ${{ secrets.SFTP_PASSWORD }}
          local-path: './*'
          remote-path: '/world/'
          
          # Only transfer files that changed since your last commit
          sync: delta