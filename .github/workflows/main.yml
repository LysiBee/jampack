name: Push Datapack to Server

on:
  push:
    branches:
      - main  # This means the robot only triggers when you push to the main branch

jobs:
  deploy:
    name: SFTP Sync
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Fast Sync Changed Files
        uses: Burnett01/rsync-deployments@v8
        with:
          switches: -avzr --delete
          path: './'
          remote_path: '/world/'
          remote_host: ${{ secrets.SFTP_HOST }}
          remote_port: ${{ secrets.SFTP_PORT }}
          remote_user: ${{ secrets.SFTP_USERNAME }}
          remote_key: ${{ secrets.SFTP_PASSWORD }}